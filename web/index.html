<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArduinoMaze</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
    <script defer src="js/maze.js"></script>
</head>
<body>
    <header class="header">MazeGame</header>
    <section class="game">
        <div class="wrapper">
            <div class="maze">
                <div class="maze_screen">
                    
                </div>
                <div class="maze_controls">                        
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('up')" value="↑">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('down')" value="↓">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('left')" value="←">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('right')" value="→">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('rotate')" value="↻">
                </div>
            </div>   
            <div class="connection">
                <h2 class="title">Connection</h2>
                <!-- WebSerial Connection Form -->
                <div class="webserial-section">
                    <h3>Serial Connection (Arduino)</h3>
                    <div id="connection-status" class="connection-status">
                        <strong>Status:</strong> <span id="status-indicator">●</span> <span id="status-text">Not Connected</span>
                    </div>
                    <form id="webserial-form" class="connectionForm">
                        <p>Baud Rate:</p>
                        <input id="baudRate" type="number" name="baudRate" value="115200" min="300" max="2000000">
                        <input type="button" class="action-button connect" onclick="startWebSerialConnect()" value="🔗 Connect Serial">
                        <input type="button" class="action-button disconnect" onclick="startWebSerialDisconnect()" value="🔌 Disconnect Serial">
                        <p>Send Command:</p>
                        <input id="serialMessage" type="text" name="serialMessage" placeholder="Enter command and press Send or Enter">
                        <input type="button" class="action-button send" onclick="sendSerialMessage()" value="📤 Send">
                        <input type="button" class="action-button clear" onclick="clearSerialOutput()" value="🗑️ Clear Log">
                            

                    </form>
                    <div id="serial-output" class="serial-log"></div>
                </div>
            </div> 
 
        </div>
    </section>

    <!-- Debug Mode Panel (Hidden by default) -->
    <div id="debug-panel" class="debug-panel" style="display: none;">
        <div class="debug-container">
            <h2>🐛 Debug Mode</h2>
            <button class="debug-close-btn" onclick="toggleDebugMode()">✕ Close</button>
            
            <div class="debug-section">
                <h3>Load Maze from Data</h3>
                <textarea id="debug-maze-input" placeholder="Enter 32 comma-separated integers (0-255) or JSON array&#10;Example: 23,45,67,89,12,34,56,78,90,11,22,33,44,55,66,77,88,99,10,21,32,43,54,65,76,87,98,9,20,31,42,53" rows="4"></textarea>
                <button class="debug-action load" onclick="loadMazeFromDebug()">📥 Load Maze</button>
            </div>

            <div class="debug-section">
                <h3>Generate Random Maze</h3>
                <button class="debug-action generate" onclick="generateRandomMaze()">🎲 Generate Random</button>
            </div>

            <div class="debug-section">
                <h3>Test Cell Info</h3>
                <p>Click any maze cell to see its wall configuration</p>
                <div id="debug-cell-info" class="debug-cell-info">
                    Click a cell to display wall info
                </div>
            </div>

            <div class="debug-section">
                <label>
                    <input type="checkbox" id="bypass-serial" onchange="toggleSerialBypass()"> Bypass Serial Connection
                </label>
            </div>
        </div>
    </div>

    <button id="debug-toggle-btn" class="debug-toggle-btn" onclick="toggleDebugMode()" title="Debug Mode (Ctrl+Shift+D)">🐛</button>

    <!-- Victory Popup -->
    <div id="victory-popup" class="victory-popup" style="display: none;">
        <div class="victory-container">
            <div class="confetti-container" id="confetti-container"></div>
            <div class="victory-content">
                <h1 class="victory-title">Felicitations!</h1>
                <p class="victory-subtitle">Tu as gagné! 🎉</p>
                <button class="victory-button" onclick="closeVictoryPopup()">Continuer</button>
            </div>
        </div>
    </div>

</body>
</html>
