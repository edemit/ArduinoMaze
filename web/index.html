<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArduinoMaze</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
    <script defer src="js/maze.js"></script>
</head>
<body>
    <header class="header">MazeGame</header>
    <section class="game">
        <div class="wrapper">
            <div class="maze">
                <div class="maze_screen">
                    
                </div>
                <div class="maze_controls">                        
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('up')" value="↑" style="background: #2196F3; color: white; cursor: pointer;">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('down')" value="↓" style="background: #2196F3; color: white; cursor: pointer;">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('left')" value="←" style="background: #2196F3; color: white; cursor: pointer;">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('right')" value="→" style="background: #2196F3; color: white; cursor: pointer;">
                    <input type="button" class="maze_button" onclick="interactionWithMatrix('rotate')" value="↻" style="background: #2196F3; color: white; cursor: pointer;">
                </div>
            </div>   
            <div class="connection">
                <h2 class="title">Connection</h2>
                <!-- WebSerial Connection Form -->
                <div class="webserial-section">
                    <h3>Serial Connection (Arduino)</h3>
                    <div id="connection-status" style="margin: 10px 0; padding: 10px; background: #ffebee; border-left: 4px solid #f44336; border-radius: 4px;">
                        <strong>Status:</strong> <span id="status-indicator">●</span> <span id="status-text">Not Connected</span>
                    </div>
                    <form id="webserial-form" class="connectionForm">
                        <p>Baud Rate:</p>
                        <input id="baudRate" type="number" name="baudRate" value="115200" min="300" max="2000000">
                        <input type="button" onclick="startWebSerialConnect()" value="🔗 Connect Serial" style="background: #4CAF50; color: white; cursor: pointer;">
                        <input type="button" onclick="startWebSerialDisconnect()" value="🔌 Disconnect Serial" style="background: #f44336; color: white; cursor: pointer;">
                        <p>Send Command:</p>
                        <input id="serialMessage" type="text" name="serialMessage" placeholder="Enter command and press Send or Enter">
                        <input type="button" onclick="sendSerialMessage()" value="📤 Send" style="background: #2196F3; color: white; cursor: pointer;">
                        <input type="button" onclick="clearSerialOutput()" value="🗑️ Clear Log" style="background: #FF9800; color: white; cursor: pointer;">
                            

                    </form>
                    <div id="serial-output" class="serial-log" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; height: 200px; overflow-y: auto; background: #f5f5f5; font-family: 'Courier New', monospace; font-size: 12px;"></div>
                </div>
            </div> 
 
        </div>
    </section>

    <!-- Debug Mode Panel (Hidden by default) -->
    <div id="debug-panel" class="debug-panel" style="display: none;">
        <div class="debug-container">
            <h2>🐛 Debug Mode</h2>
            <button class="debug-close-btn" onclick="toggleDebugMode()">✕ Close</button>
            
            <div class="debug-section">
                <h3>Load Maze from Data</h3>
                <textarea id="debug-maze-input" placeholder="Enter 32 comma-separated integers (0-255) or JSON array&#10;Example: 23,45,67,89,12,34,56,78,90,11,22,33,44,55,66,77,88,99,10,21,32,43,54,65,76,87,98,9,20,31,42,53" rows="4"></textarea>
                <button onclick="loadMazeFromDebug()" style="background: #4CAF50; color: white; padding: 10px 20px; margin-top: 10px; cursor: pointer;">📥 Load Maze</button>
            </div>

            <div class="debug-section">
                <h3>Generate Random Maze</h3>
                <button onclick="generateRandomMaze()" style="background: #2196F3; color: white; padding: 10px 20px; cursor: pointer;">🎲 Generate Random</button>
            </div>

            <div class="debug-section">
                <h3>Test Cell Info</h3>
                <p>Click any maze cell to see its wall configuration</p>
                <div id="debug-cell-info" style="background: #f5f5f5; padding: 10px; margin-top: 10px; min-height: 60px; border-radius: 4px; font-family: monospace; font-size: 12px;">
                    Click a cell to display wall info
                </div>
            </div>

            <div class="debug-section">
                <label>
                    <input type="checkbox" id="bypass-serial" onchange="toggleSerialBypass()"> Bypass Serial Connection
                </label>
            </div>
        </div>
    </div>

    <button id="debug-toggle-btn" class="debug-toggle-btn" style="display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 15px; background: #ff9800; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 18px; z-index: 1000;" onclick="toggleDebugMode()" title="Debug Mode (Ctrl+Shift+D)">🐛</button>

</body>
</html>
